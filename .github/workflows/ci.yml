name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Typecheck the e2e suite
        run: npx tsc --noEmit -p e2e
      - run: npm test
      - run: npm run build:web
      - name: Database RLS + RPC tests (PGlite)
        working-directory: supabase/tests
        run: npm ci && npm test
