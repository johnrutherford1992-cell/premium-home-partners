name: Brand capture

# Captures premiumhomepartners.com (screenshots, text, colors, fonts, logo files)
# into docs/brand/capture/ on the PR branch, as the reference for the app's
# branding. Runs when a pull request gets the `brand-capture` label.
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.label.name == 'brand-capture' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture the site
        run: node scripts/brand-capture.mjs https://www.premiumhomepartners.com/ docs/brand/capture

      - name: Commit the capture
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/brand/capture
          git commit -m "Capture premiumhomepartners.com branding reference" || echo "nothing to commit"
          git push
